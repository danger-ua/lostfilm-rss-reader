[project]
name = "lostfilm-rss-reader"
version = "0.1.0"
description = "LostFilm.tv RSS feed reader and download link resolver"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "deluge-web-client>=2.0.3",
    "python-telegram-bot>=22.6",
]

[project.scripts]
lostfilm = "lostfilm.cli:main"

[dependency-groups]
dev = [
    "aiogram>=3.26.0",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lostfilm"]
